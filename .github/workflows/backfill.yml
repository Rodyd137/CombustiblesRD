name: Backfill (una vez)

# Lee todas las circulares de las listas anuales del MICM y deja un informe
# en data/backfill/informe.json. No toca el historial. Solo a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
      - name: Backfill
        env:
          BACKFILL_GUARDAR_HTML: "1"
        run: cd scraper && python backfill.py
      - name: Commit informe
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add data/backfill
          git diff --cached --quiet && exit 0
          git commit -m "backfill: informe de circulares $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
